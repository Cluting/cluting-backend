name: Deploy to Server

on:
  push:
    branches: [ "main", "develop", "cicd/githubactions"]

jobs:
  build:
    name: Build in Github Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy secret
        env:
          APPLICATION_FILE: ${{ secrets.APPLICATION_PROFILE_DEV }}
          DIR: ./src/main/resources
          APPLICATION_FILE_NAME: application-dev.yml
        run: |
          touch $DIR/$APPLICATION_FILE_NAME
          echo "$APPLICATION_FILE" > $DIR/$APPLICATION_FILE_NAME

      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload Build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar

  deploy:
    name: CD with SSH
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Create app directory on Server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo '${{ secrets.SERVER_PASSWORD }}' | sudo -S mkdir -p /home/ubuntu/app/ && sudo -S chown $USER:$USER /home/ubuntu/app/"

      - name: SCP JAR to Server (Password Auth)
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT }} \
          *.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/app/

      - name: Start Redis Server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'sudo systemctl start redis-server'

      - name: Deploy Application
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          # 사용할 포트
          DEPLOY_PORT=${{ secrets.DEPLOY_PORT }}

          # 기존 프로세스 종료
          sudo fuser -k -n tcp $DEPLOY_PORT || true
          sleep 15

          # 최신 JAR 실행
          sudo nohup java -jar /home/ubuntu/app/*.jar --server.port=$DEPLOY_PORT > /home/ubuntu/app/nohup.out 2>&1 &
          EOF
